# ==============================
# 听书内容生产流水线 - 配置文件
# ==============================
# 请填写你自己的API密钥

# 阿里云市场图书API（获取封面/作者/简介）
aliyun:
  app_code: "你的阿里云APPCODE"   # https://market.aliyun.com/products/57124001/cmapi00037355.html
  base_url: "http://bookinfo.market.aliyuncs.com"

# 豆包API（生成解读文稿+金句）
doubao:
  api_key: "你的豆包API密钥"     # https://console.volcengine.com/ark
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "ep-20240512xxxxxx"    # 替换为你的豆包模型端点ID

# 火山引擎TTS（音频合成）
tts:
  access_key: "你的AccessKey"   # https://console.volcengine.com/iam/keymanage/
  secret_key: "你的SecretKey"
  app_id: "你的项目AppID"
  voice_type: "BV700_V2"        # 女声-知性温和（可换：BV001_V2男声/BV500_V2童声）

# 流水线设置
pipeline:
  max_workers: 5                 # 并发数（建议5-10）
  retry_times: 3                 # 失败重试次数
  retry_delay: 5                 # 重试间隔（秒）
  batch_size: 10                 # 每批处理数量
  test_mode: true                # true=测试模式（只处理前3本书）

# 测试用书名列表（生产时替换为真实列表）
test_books:
  - "活着"
  - "平凡的世界"
  - "百年孤独"
